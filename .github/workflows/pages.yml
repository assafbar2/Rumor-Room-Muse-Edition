name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
      - name: Export the complete game
        run: |
          if [ "$CUSTOM_BASE" = "/" ]; then
            export PAGES_BASE_PATH=""
          elif [ -n "$CUSTOM_BASE" ]; then
            export PAGES_BASE_PATH="$CUSTOM_BASE"
          fi
          npm run build:pages
        env:
          CUSTOM_BASE: ${{ vars.PAGES_BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
